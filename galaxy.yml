namespace: kc_gardner
name: ai_infra
version: 0.1.0
readme: README.md
authors:
  - KC Gardner
description: Roles for self-hosted AI infrastructure - vLLM, GPUStack and Open WebUI on NVIDIA hosts, and the KVM, NetBox, inventory and patching roles for the lab around them
license:
  - MIT
tags:
