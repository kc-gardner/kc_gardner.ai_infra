- name: Install virtualization packages
  ansible.builtin.dnf5:
    name: "{{ kvm_host_packages }}"
    state: present

- name: Enable libvirt daemon sockets
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ kvm_host_libvirt_sockets }}"

- name: Add users to the libvirt group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: libvirt
    append: true
  loop: "{{ kvm_host_users }}"
