- name: Create storage pool directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "0711"
  loop: "{{ kvm_host_storage_pools }}"

- name: Label custom storage pool directories for SELinux
  community.general.sefcontext:
    target: "{{ item.path }}(/.*)?"
    setype: virt_image_t
    state: present
  loop: "{{ kvm_host_storage_pools }}"
  when: item.path != '/var/lib/libvirt/images'
  notify: Restore SELinux contexts on storage pools

- name: Flush handlers so SELinux labels apply before pools start
  ansible.builtin.meta: flush_handlers

- name: List defined storage pools
  community.libvirt.virt_pool:
    command: list_pools
  register: kvm_host_existing_pools

- name: Define storage pools
  community.libvirt.virt_pool:
    command: define
    name: "{{ item.name }}"
    xml: "{{ lookup('ansible.builtin.template', 'pool.xml.j2') }}"
  loop: "{{ kvm_host_storage_pools }}"
  when: item.name not in kvm_host_existing_pools.list_pools

- name: Start storage pools
  community.libvirt.virt_pool:
    name: "{{ item.name }}"
    state: active
  loop: "{{ kvm_host_storage_pools }}"

- name: Autostart storage pools
  community.libvirt.virt_pool:
    name: "{{ item.name }}"
    autostart: true
  loop: "{{ kvm_host_storage_pools }}"
