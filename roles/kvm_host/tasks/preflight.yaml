- name: Ensure the host is Fedora
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Fedora'
    fail_msg: "kvm_host supports Fedora only, found {{ ansible_facts.distribution }}"

- name: Check CPU for hardware virtualization flags
  ansible.builtin.command: grep -Ecm1 'vmx|svm' /proc/cpuinfo
  register: kvm_host_cpu_flags
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ensure hardware virtualization is available
  ansible.builtin.assert:
    that:
      - kvm_host_cpu_flags.rc == 0
    fail_msg: CPU does not expose VT-x/AMD-V. Enable virtualization in the BIOS.
