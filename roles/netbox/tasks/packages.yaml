# python3-cryptography is for the community.crypto modules that make the
# self-signed certificate.
- name: Install Podman
  ansible.builtin.dnf:
    name:
      - podman
      - python3-cryptography
    state: present

- name: Check the Podman version
  ansible.builtin.command:
    argv: [podman, version, --format, "{{ '{{ .Client.Version }}' }}"]
  register: netbox_podman_version
  changed_when: false
  when: not ansible_check_mode

# Quadlet's Notify=healthy, which orders the services, needs Podman 5.
- name: Ensure Podman is 5.0 or later
  ansible.builtin.assert:
    that:
      - netbox_podman_version.stdout is version('5.0', '>=')
    fail_msg: "netbox needs Podman 5.0 or later, found {{ netbox_podman_version.stdout }}"
    quiet: true
  when: not ansible_check_mode
