- name: Create the data volume
  ansible.builtin.command: docker volume create {{ open_webui_volume | quote }}
  changed_when: true
  when: not open_webui_volume_exists | bool

# Only runs with open_webui_replace_unmanaged: true (preflight fails otherwise).
- name: Remove containers this role did not create
  ansible.builtin.command: docker rm --force {{ item | quote }}
  changed_when: true
  loop: "{{ open_webui_unmanaged }}"

# Creates the container, recreates it when the compose or environment file changed,
# or starts it when it was stopped. --wait blocks until the image's healthcheck passes.
# A dry run cannot start a stopped container, so check mode does not wait.
- name: Start Open WebUI
  community.docker.docker_compose_v2:
    project_src: "{{ open_webui_compose_dir }}"
    state: present
    pull: missing
    remove_orphans: true
    wait: "{{ not ansible_check_mode }}"
    wait_timeout: "{{ open_webui_start_timeout | int }}"
  register: open_webui_up
  # In check mode a first install's folder and compose file do not exist yet.
  when: not (ansible_check_mode and open_webui_compose_folder is changed)

- name: Ask Open WebUI for its version
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ open_webui_port }}/api/version
    return_content: true
  register: open_webui_version
  when: not ansible_check_mode

# The module lists what compose did: Creating or Recreate when the container was
# (re)created, only Starting when a stopped one was started. Check mode does not write
# the new files, so there a configuration change counts as a recreate.
- name: Record what happened to the container
  ansible.builtin.set_fact:
    open_webui_outcome: >-
      {%- set did = open_webui_up.actions | default([]) | selectattr('what', 'eq', 'container')
                    | map(attribute='status') | list -%}
      {%- if open_webui_up is skipped or (ansible_check_mode and open_webui_config_changed | bool)
            or 'Creating' in did or 'Recreate' in did -%}
      (re)created
      {%- elif 'Starting' in did -%}
      started
      {%- endif -%}

- name: Report Open WebUI
  ansible.builtin.debug:
    msg: >-
      Open WebUI {{ open_webui_version.json.version | default('(check mode)') }} on
      http://{{ inventory_hostname }}:{{ open_webui_port }}{{ (', ' ~ ('would be ' if ansible_check_mode else '')
      ~ open_webui_outcome) if open_webui_outcome else '' }}
