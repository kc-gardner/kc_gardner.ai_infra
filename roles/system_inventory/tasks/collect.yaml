---
# Facts plus read-only health checks. Every check is best-effort: a host that
# can't answer one gets 'unknown' in the report instead of failing the play.

- name: Gather hardware, network and virtualization facts
  ansible.builtin.setup:
    gather_subset:
      - hardware
      - network
      - virtual
    gather_timeout: "{{ system_inventory_gather_timeout }}"

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto
  failed_when: false   # missing rpm/apt Python bindings leaves packages_installed null
  when: system_inventory_collect_packages | bool

- name: List failed systemd units  # noqa: command-instead-of-module (read-only, no module lists failed units)
  ansible.builtin.command:
    cmd: systemctl list-units --state=failed --plain --no-legend --no-pager
  register: __system_inventory_failed_units
  changed_when: false
  failed_when: false
  when: ansible_facts.service_mgr == 'systemd'

- name: Check firewalld state  # noqa: command-instead-of-module (read-only, must not fail when firewalld is absent)
  ansible.builtin.command:
    cmd: systemctl is-active firewalld
  register: __system_inventory_firewalld
  changed_when: false
  failed_when: false
  when: ansible_facts.service_mgr == 'systemd'

- name: List pending package updates
  ansible.builtin.command:
    cmd: dnf -q repoquery --upgrades --qf '%{name}.%{arch}\n'
  register: __system_inventory_updates
  changed_when: false
  failed_when: false
  when:
    - system_inventory_check_updates | bool
    - ansible_facts.pkg_mgr in ['dnf', 'dnf5']

- name: Check whether a reboot is required
  ansible.builtin.command:
    cmd: dnf needs-restarting -r
  register: __system_inventory_reboot
  changed_when: false
  failed_when: false
  when: ansible_facts.pkg_mgr in ['dnf', 'dnf5']
