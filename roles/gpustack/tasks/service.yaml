- name: Reload the user's systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ gpustack_user }}"
  environment: "{{ gpustack_user_env }}"
  when: gpustack_quadlet_files is changed

# Quadlet services cannot be enabled: the [Install] section of the unit makes
# the user's systemd start it at boot. A first start or an upgrade sets up the
# database, which takes a few minutes.
- name: Start GPUStack
  ansible.builtin.systemd_service:
    name: gpustack.service
    scope: user
    state: "{{ 'restarted' if gpustack_quadlet_files is changed or gpustack_env_written is changed else 'started' }}"
  become: true
  become_user: "{{ gpustack_user }}"
  environment: "{{ gpustack_user_env }}"
